<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --blue:#2563eb; --blue-hover:#1d4ed8; --gray-sec:#64748b;
      --gray-light:#f9fafb; --gray-med:#e5e7eb; --gray-dark:#111827;
      --green:#10b981; --orange:#f59e0b; --red:#ef4444;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--gray-light);}
    a{color:var(--blue);text-decoration:none;}
    a:hover{color:var(--blue-hover);text-decoration:underline;}
    input:focus{outline:none;border-color:var(--blue) !important;box-shadow:0 0 0 3px rgba(37,99,235,0.15);}
    button:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  </style>
</helmet>
<div style="min-height:844px;width:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#f9fafb 0%,#eef2f7 100%);padding:24px;">
  <div style="width:100%;max-width:400px;background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 4px 12px rgba(17,24,39,0.06);padding:40px 32px;display:flex;flex-direction:column;gap:24px;">

    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div style="width:48px;height:48px;border-radius:10px;background:#2563eb;display:flex;align-items:center;justify-content:center;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 L14.5 8.5 L21 9.3 L16 13.9 L17.4 20.4 L12 17 L6.6 20.4 L8 13.9 L3 9.3 L9.5 8.5 Z"></path>
        </svg>
      </div>
      <div style="font-size:20px;font-weight:600;color:#111827;">Anara Quick Replies</div>
      <div style="font-size:14px;color:#64748b;">Masuk untuk mengakses dashboard CS</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px;">
      <div style="display:flex;flex-direction:column;gap:6px;">
        <label style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:#111827;">Email</label>
        <input type="email" placeholder="nama@anara.com" style="height:40px;padding:0 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;color:#111827;background:#ffffff;" />
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <label style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:#111827;">Password</label>
          <a href="#" style="font-size:12px;">Lupa password?</a>
        </div>
        <input type="password" placeholder="••••••••" style="height:40px;padding:0 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;color:#111827;background:#ffffff;" />
      </div>

      <button style="height:40px;background:#2563eb;color:#ffffff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">Login</button>

      <div style="display:flex;align-items:center;gap:12px;">
        <div style="flex:1;height:1px;background:#e5e7eb;"></div>
        <span style="font-size:12px;color:#64748b;">atau</span>
        <div style="flex:1;height:1px;background:#e5e7eb;"></div>
      </div>

      <button style="height:40px;background:#ffffff;color:#111827;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47a5.6 5.6 0 0 1-2.4 3.65v3.03h3.86c2.26-2.09 3.56-5.16 3.56-8.92Z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.93-2.9l-3.86-3.03c-1.07.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.29v3.12A12 12 0 0 0 12 24Z"/>
          <path fill="#FBBC05" d="M5.27 14.26A7.2 7.2 0 0 1 4.89 12c0-.79.14-1.55.38-2.26V6.62H1.29A12 12 0 0 0 0 12c0 1.94.46 3.77 1.29 5.38l3.98-3.12Z"/>
          <path fill="#EA4335" d="M12 4.77c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.94 1.19 15.24 0 12 0 7.31 0 3.26 2.69 1.29 6.62l3.98 3.12C6.22 6.88 8.87 4.77 12 4.77Z"/>
        </svg>
        Login dengan Google
      </button>
    </div>

    <div style="text-align:center;font-size:14px;color:#64748b;">
      Belum punya akun? <a href="#">Daftar di sini</a>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
