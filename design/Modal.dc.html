<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *{box-sizing:border-box;}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
    a{color:#2563eb;}
    input:focus, textarea:focus, select:focus{outline:none;border-color:#2563eb !important;box-shadow:0 0 0 3px rgba(37,99,235,0.15);}
  </style>
</helmet>
<div style="width:900px;height:760px;background:rgba(17,24,39,0.5);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);">
  <div style="width:600px;max-height:680px;overflow:auto;background:#ffffff;border-radius:12px;box-shadow:0 20px 40px rgba(17,24,39,0.25);display:flex;flex-direction:column;">

    <div style="display:flex;align-items:center;justify-content:space-between;padding:24px;border-bottom:1px solid #e5e7eb;">
      <div style="font-size:20px;font-weight:600;color:#111827;">Tambah Quick Reply</div>
      <button style="width:32px;height:32px;border:none;background:transparent;color:#64748b;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:6px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </button>
    </div>

    <div style="padding:24px;display:flex;flex-direction:column;gap:20px;">

      <div style="display:flex;flex-direction:column;gap:6px;">
        <label style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:#111827;">Question <span style="color:#ef4444;">*</span></label>
        <input type="text" placeholder="Contoh: Berapa harga paket Bali?" value="Apakah bisa reschedule jadwal keberangkatan?" style="height:40px;padding:0 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;color:#111827;" />
        <div style="font-size:12px;color:#64748b;">Minimal 10 karakter</div>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px;">
        <div style="display:flex;justify-content:space-between;">
          <label style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:#111827;">Answer <span style="color:#ef4444;">*</span></label>
          <span style="font-size:12px;color:#64748b;">150/5000</span>
        </div>
        <textarea rows="5" placeholder="Tulis jawaban lengkap di sini..." style="padding:12px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;color:#111827;font-family:inherit;resize:vertical;">Bisa Kak, reschedule diperbolehkan maksimal H-7 sebelum keberangkatan dengan biaya admin Rp 250.000. Untuk reschedule kurang dari H-7 akan dikenakan biaya sesuai kebijakan masing-masing maskapai.</textarea>
        <div style="font-size:12px;color:#64748b;">Minimal 50 karakter</div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:16px;">
        <div style="display:flex;flex-direction:column;gap:6px;">
          <label style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:#111827;">Package</label>
          <select style="height:40px;padding:0 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;color:#111827;background:#fff;">
            <option>Pilih paket...</option>
            <option>Hongkong</option>
            <option>Korea</option>
            <option>Vietnam</option>
            <option>Eropa</option>
          </select>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <label style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:#111827;">Category</label>
          <select style="height:40px;padding:0 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;color:#111827;background:#fff;">
            <option>Pilih kategori...</option>
            <option>Harga</option>
            <option>Jadwal</option>
            <option>Visa</option>
            <option>Pembayaran</option>
          </select>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px;">
        <label style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:#111827;">Tags</label>
        <input type="text" placeholder="reschedule, jadwal, biaya (pisahkan dengan koma)" style="height:40px;padding:0 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;color:#111827;" />
      </div>

    </div>

    <div style="display:flex;justify-content:flex-end;gap:12px;padding:20px 24px;border-top:1px solid #e5e7eb;">
      <button style="height:40px;padding:0 20px;background:#fff;color:#111827;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">Cancel</button>
      <button style="height:40px;padding:0 20px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">Save</button>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
